[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
fs_permissions = [
  { access = "read", path = "../circuits" },
  { access = "read", path = "./test" },
  { access = "read", path = "./src" },
  { access = "write", path = "../deployments" },
]
use_literal_content = true

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
monad_testnet = "${MONAD_DEPLOY_RPC_URL}"

[profile.deploy]
chain_id = 10143
bytecode_hash = "none"
cbor_metadata = true
